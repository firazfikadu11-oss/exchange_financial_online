<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account - Exchange Financial Online</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 32px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      background: #0f172a;
      color: white;
      border-radius: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 24px;
      margin-bottom: 8px;
    }

    .text {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;

      border: 1px solid #d1d5db;
      border-radius: 10px;

      outline: none;
      font-size: 16px;
      background: #fafafa;
    }

    input:focus {
      border-color: #111827;
      background: white;
    }

    .create-btn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 10px;

      background: #0f172a;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .create-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #6b7280;
    }

    .login-link a {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGO -->
    <div class="logo">
      E
    </div>

    <!-- TITLE -->
    <h1>
      Create Your Account
    </h1>

    <p class="text">
      Exchange Financial Online
    </p>

    <!-- REGISTER FORM -->
    <form id="registerForm">

      <!-- FIRST NAME -->
      <div class="input-group">

        <label for="firstName">
          First Name
        </label>

        <input
          type="text"
          id="firstName"
          placeholder="Enter your first name"
          autocomplete="given-name"
          required
        >

      </div>

      <!-- PHONE -->
      <div class="input-group">

        <label for="phone">
          Phone Number
        </label>

        <input
          type="tel"
          id="phone"
          placeholder="Enter phone number"
          inputmode="tel"
          autocomplete="tel"
          required
        >

      </div>

      <!-- PIN -->
      <div class="input-group">

        <label for="pin">
          6-Digit PIN
        </label>

        <input
          type="password"
          id="pin"
          placeholder="Enter 6-digit PIN"
          inputmode="numeric"
          autocomplete="new-password"
          maxlength="6"
          pattern="[0-9]{6}"
          required
        >

      </div>

      <!-- BUTTON -->
      <button
        type="submit"
        class="create-btn"
        id="createBtn"
      >
        Create Account
      </button>

      <!-- MESSAGE -->
      <div
        class="message"
        id="message"
      ></div>

    </form>

    <!-- LOGIN -->
    <div class="login-link">

      Already have an account?

      <a href="login.html">
        Login
      </a>

    </div>

    <!-- FOOTER -->
    <div class="footer">
      © 2026 Exchange Financial Online
    </div>

  </div>


  <script>

    // ==========================================
    // SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://pvwlgkxddazcgtsewgji.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2d2xna3hkZGF6Y2d0c2V3Z2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTU5MjQsImV4cCI6MjEwNjQ5MTkyNH0.4Oko-gU9wmr6Ylfh2hj10L73QHgVtKaVBWbyeCAXaS8";


    // ==========================================
    // ELEMENTS
    // ==========================================

    const registerForm =
      document.getElementById("registerForm");

    const firstNameInput =
      document.getElementById("firstName");

    const phoneInput =
      document.getElementById("phone");

    const pinInput =
      document.getElementById("pin");

    const message =
      document.getElementById("message");

    const createBtn =
      document.getElementById("createBtn");


    // ==========================================
    // PIN - NUMBERS ONLY
    // ==========================================

    pinInput.addEventListener(
      "input",
      function () {

        this.value =
          this.value
            .replace(/[^0-9]/g, "")
            .slice(0, 6);

      }
    );


    // ==========================================
    // MESSAGE FUNCTION
    // ==========================================

    function showMessage(text, type) {

      message.style.display = "block";

      message.textContent = text;

      if (type === "success") {

        message.style.color = "green";

      } else {

        message.style.color = "red";

      }

    }


    // ==========================================
    // REGISTER
    // ==========================================

    registerForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();


        const firstName =
          firstNameInput.value.trim();

        const phone =
          phoneInput.value.trim();

        const pin =
          pinInput.value.trim();


        message.style.display = "none";


        // ======================================
        // FIRST NAME VALIDATION
        // ======================================

        if (!firstName) {

          showMessage(
            "Please enter your first name.",
            "error"
          );

          return;

        }


        // ======================================
        // PHONE VALIDATION
        // ======================================

        if (!phone) {

          showMessage(
            "Please enter your phone number.",
            "error"
          );

          return;

        }


        // ======================================
        // PIN VALIDATION
        // ======================================

        if (!/^[0-9]{6}$/.test(pin)) {

          showMessage(
            "PIN must contain exactly 6 digits.",
            "error"
          );

          return;

        }


        // ======================================
        // DISABLE BUTTON
        // ======================================

        createBtn.disabled = true;

        createBtn.textContent =
          "Getting account...";


        try {

          // ====================================
          // CREATE USER
          // ====================================

          const response = await fetch(
            `${SUPABASE_URL}/rest/v1/users`,
            {
              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  `Bearer ${SUPABASE_KEY}`,

                "Prefer":
                  "return=minimal"

              },

              body: JSON.stringify({

                first_name: firstName,

                phone: phone,

                pin: pin,

                balance: 0

              })

            }
          );


          // ====================================
          // ERROR
          // ====================================

          if (!response.ok) {

            const errorText =
              await response.text();

            console.log(
              "Supabase error:",
              errorText
            );


            if (
              response.status === 409 ||
              errorText.includes("duplicate") ||
              errorText.includes("unique")
            ) {

              showMessage(
                "This phone number is already registered.",
                "error"
              );

            } else {

              showMessage(
                "Could not create account. Please try again.",
                "error"
              );

            }

            return;

          }


          // ====================================
          // SUCCESS
          // ====================================

          localStorage.setItem("efo_phone", phone);

          showMessage(
            "Account created successfully!",
            "success"
          );


          // ====================================
          // GO TO DASHBOARD
          // ====================================

          setTimeout(
            function () {

              window.location.href =
                "dashboard.html";

            },
            1200
          );


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );

          showMessage(
            "Connection error. Please check your internet connection.",
            "error"
          );

        } finally {

          createBtn.disabled = false;

          createBtn.textContent =
            "Create Account";

        }

      }
    );

  </script>

</body>
</html>
