<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Exchange Financial Online</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f4f7f6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 390px;
      background: white;
      padding: 32px 25px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: 0 auto 15px;
      background: #111827;
      color: white;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #111827;
      font-size: 24px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .welcome {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .input-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      outline: none;
      font-size: 16px;
      background: #fafafa;
    }

    input:focus {
      border-color: #111827;
      background: white;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      font-size: 14px;
      margin-top: 15px;
      display: none;
    }

    .register {
      text-align: center;
      margin-top: 24px;
      color: #6b7280;
      font-size: 14px;
    }

    .register a {
      color: #111827;
      font-weight: bold;
      text-decoration: none;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">EF</div>

    <h1>Welcome to Exchange Financial Online</h1>

    <p class="welcome">
      Login to access your wallet securely.
    </p>

    <form id="loginForm">

      <div class="input-group">
        <label for="phone">Phone Number</label>

        <input
          type="tel"
          id="phone"
          placeholder="phone number"
          required
        >
      </div>

      <div class="input-group">
        <label for="pin">PIN</label>

        <input
          type="password"
          id="pin"
          placeholder="pin"
          inputmode="numeric"
          maxlength="6"
          required
        >
      </div>

      <button class="login-btn" id="loginBtn" type="submit">
        Login
      </button>

      <div class="message" id="message"></div>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="footer">
      © 2026 Exchange Financial Online
    </div>

  </div>


  <script>

    const SUPABASE_URL =
      "https://pvwlgkxddazcgtsewgji.supabase.co";

    const SUPABASE_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB2d2xna3hkZGF6Y2d0c2V3Z2ppIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MTU5MjQsImV4cCI6MjEwNjQ5MTkyNH0.4Oko-gU9wmr6Ylfh2hj10L73QHgVtKaVBWbyeCAXaS8";


    document.getElementById("loginForm").addEventListener("submit", async function(event) {

      event.preventDefault();

      const phone =
        document.getElementById("phone").value.trim();

      const pin =
        document.getElementById("pin").value.trim();

      const message =
        document.getElementById("message");

      const loginBtn =
        document.getElementById("loginBtn");


      message.style.display = "none";


      if (!phone || !pin) {

        message.style.display = "block";
        message.style.color = "red";
        message.textContent = "Please fill in all fields.";

        return;
      }


      loginBtn.disabled = true;
      loginBtn.textContent = "Checking...";


      try {

        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/users?phone=eq.${encodeURIComponent(phone)}&pin=eq.${encodeURIComponent(pin)}&select=id,phone`,
          {
            method: "GET",

            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );


        if (!response.ok) {
          throw new Error("Database request failed");
        }


        const users = await response.json();


        if (users.length > 0) {

          localStorage.setItem(
            "efo_phone",
            users[0].phone
          );

          message.style.display = "block";
          message.style.color = "green";
          message.textContent = "Login successful!";


          setTimeout(function() {
            window.location.href = "./dashboard.html";
          }, 700);

        } else {

          message.style.display = "block";
          message.style.color = "red";
          message.textContent =
            "Invalid phone number or PIN.";

        }


      } catch (error) {

        console.error(error);

        message.style.display = "block";
        message.style.color = "red";
        message.textContent =
          "Connection error. Please try again.";

      }


      loginBtn.disabled = false;
      loginBtn.textContent = "Login";

    });

  </script>

</body>
</html>
